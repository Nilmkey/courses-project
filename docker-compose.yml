services:
  # -------------------------------------------------------------
  # 1. Серверный API (Backend)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: courses-backend
    restart: unless-stopped
    ports:
      - "7777:7777"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=7777
      - HOST=0.0.0.0
      # DB_URL подгружается напрямую из .env (MongoDB Atlas Cloud)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./.env:/app/.env:ro
      - ./.env:/.env:ro
    networks:
      - courses-network

  # -------------------------------------------------------------
  # 2. Клиентское приложение (Frontend Next.js)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: courses-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Для серверных запросов Next.js (SSR / middleware proxy) внутри Docker-сети
      - BACKEND_URL=http://backend:7777
      # Для клиентских браузерных запросов через хост
      - NEXT_PUBLIC_API_URL=http://localhost:7777/api
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:7777
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
      - ./.env:/app/.env:ro
      - ./.env:/.env:ro
    depends_on:
      - backend
    networks:
      - courses-network

# -------------------------------------------------------------
# Внутренняя сеть Docker
# -------------------------------------------------------------
networks:
  courses-network:
    driver: bridge
